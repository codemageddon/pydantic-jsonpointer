[project]
name = "pydantic-jsonpointer"
dynamic = ["version"]
description = "JSONPointer (RFC6901) implementation for Pydantic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
maintainers = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://pydantic-jsonpointer.codemageddon.me/"
Repository = "https://github.com/codemageddon/pydantic-jsonpointer.git"
Issues = "https://github.com/codemageddon/pydantic-jsonpointer/issues"
Changelog = "https://github.com/codemageddon/pydantic-jsonpointer/blob/main/CHANGELOG.md"
Documentation = "https://pydantic-jsonpointer.codemageddon.me/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pydantic_jsonpointer/__version__.py"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.11",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
extend-select = ["I"]
