# Trusted Publisher Configuration (Production PyPI)
#
# For this workflow to publish via OIDC trusted publishing, the package must
# have a trusted publisher configured in its PyPI project settings at:
#   https://pypi.org/manage/project/pydantic-jsonpointer/settings/publishing/
#
# Trusted publisher settings:
#   Owner:         codemageddon
#   Repository:    pydantic-jsonpointer
#   Workflow name: publish.yaml
#   Environment:   pypi

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag must point to a commit reachable from origin/main"
            exit 1
          }

      - name: Verify VERSION matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: ${TAG_VERSION}"
          PKG_VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/pydantic_jsonpointer/__version__.py)
          NORM_TAG=$(uv run --with packaging --no-project python -c "from packaging.version import Version; print(Version('${TAG_VERSION}'))")
          NORM_PKG=$(uv run --with packaging --no-project python -c "from packaging.version import Version; print(Version('${PKG_VERSION}'))")
          if [ "$NORM_PKG" != "$NORM_TAG" ]; then
            echo "::error::Version mismatch: got '${PKG_VERSION}' (normalized '${NORM_PKG}'), expected '${TAG_VERSION}' (normalized '${NORM_TAG}')"
            exit 1
          fi
          echo "Version matches tag ${GITHUB_REF_NAME} (normalized: ${NORM_PKG})"

  build:
    needs: verify-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build package
        run: uv build --out-dir dist/

      - name: List built distributions
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          attestations: true
