[tools]
python = ["3.14", "3.13", "3.12", "3.11", "3.10"]
uv = "latest"
pre-commit = "4"

[env]
UV_NO_MANAGED_PYTHON = true

[tasks.ruff]
description = "Lint + format check (mirrors CI 'ruff' job)"
run = [
    "uv sync --frozen",
    "uv run ruff check .",
    "uv run ruff format --check .",
]

[tasks.mypy]
description = "Strict type check (mirrors CI 'mypy' job)"
run = [
    "uv sync --frozen",
    "uv run mypy src tests",
]

[tasks.pytest]
description = "Run test suite (mirrors CI 'pytest' job)"
run = [
    "uv sync --frozen",
    "uv run pytest",
]

[tasks.ci]
description = "Run all CI checks (ruff + mypy + pytest)"
depends = ["ruff", "mypy", "pytest"]
