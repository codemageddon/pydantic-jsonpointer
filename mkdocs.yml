site_name: pydantic-jsonpointer
site_url: https://pydantic-jsonpointer.codemageddon.me/
site_description: JSONPointer (RFC 6901) implementation for Pydantic 2.x.
repo_url: https://github.com/codemageddon/pydantic-jsonpointer
repo_name: codemageddon/pydantic-jsonpointer
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            show_source: true
            merge_init_into_class: true
            show_root_heading: true
            show_if_no_docstring: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - concepts/index.md
      - JsonPointer type: concepts/json-pointer.md
      - Model-based pointers: concepts/model-based-pointers.md
      - Traversal: concepts/traversal.md
      - Adapters: concepts/adapters.md
      - Field resolvers: concepts/field-resolvers.md
      - Errors: concepts/errors.md
  - API Reference:
      - reference/index.md
      - pointer_from_model: reference/model-path.md
      - pydantic_jsonpointer.types: reference/types.md
      - pydantic_jsonpointer.traversal: reference/traversal.md
      - pydantic_jsonpointer.adapters: reference/adapters.md
      - pydantic_jsonpointer.pydantic_adapter: reference/pydantic-adapter.md
      - pydantic_jsonpointer.errors: reference/errors.md
  - Contributing: contributing.md
